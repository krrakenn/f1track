[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1line"
version = "0.1.0"
description = "F1 Optimal Racing Line Predictor on Real Circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "F1Line Team" }]

dependencies = [
    # Core
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "plotly>=5.20",
    # Data
    "fastf1>=3.3",
    "requests>=2.31",
    # Optimization
    "casadi>=3.6",
    "cvxpy>=1.4",
    # CLI / config
    "typer>=0.12",
    "pyyaml>=6.0",
    # App
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "black>=24.4,<25",
]
speedup = [
    "numba>=0.59,<1",
]

[project.scripts]
f1line = "f1line.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"f1line" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["src/f1line"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
