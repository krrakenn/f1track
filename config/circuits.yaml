# Circuit registry – 2026 FIA Formula One World Championship calendar.
#
# Source of the calendar: OpenF1 /sessions?year=2026 (checked 2026-10-28). Bahrain and
# Saudi Arabia were cancelled in 2026 (OpenF1 is_cancelled=true); they are kept here with
# status "cancelled" so their geometry can still be built from 2025 data.
#
# Fields
#   round:           2026 round number (null for cancelled events)
#   name:            display name
#   openf1_key:      OpenF1 / MultiViewer circuit_key
#   fastf1_event:    FastF1 event name (FastF1 downloads are blocked since 2026; cache only)
#   tum_file:        TUM racetrack-database track file, or null if TUM has no such circuit.
#                    A TUM layout that no longer matches the driven laps is rejected
#                    automatically by the alignment check and OSM is used instead.
#   lat, lon:        approximate circuit centre [deg], used for the OSM query box
#   nominal_width_m: assumed track width when TUM widths are unavailable [m]
#                    (FIA Grade 1 minimum is 12 m; street circuits are narrower in places)
#   code:            three-letter track code shown in the web app's timing tower
#   status:          raced | upcoming | cancelled (data year is picked automatically)

